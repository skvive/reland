name: Import AI Generated Board Thumbnails (one-off)
on:
  push:
    branches: [feat/community-blogger-builder-20261112]
    paths:
      - .github/workflows/import-board-photos-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import nine images from short-lived design asset URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/assets/boards
          while IFS='|' read -r idx url; do
            [ -n "$idx" ] || continue
            target="static/assets/boards/cover-${idx}.jpg"
            if [ -s "$target" ]; then
              continue
            fi
            curl --retry 3 --connect-timeout 15 --max-time 45 -fsSL "$url" -o "$target"
            file --mime-type "$target" | grep -E 'image/jpeg'
            test "$(wc -c < "$target")" -gt 1800
          done <<'PHOTO_URLS'
