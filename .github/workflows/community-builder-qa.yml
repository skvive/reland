name: Community Blogger Builder QA
on:
  pull_request:
    paths:
      - "app.py"
      - "db_engine.py"
      - "community_builder.py"
      - "static/app.js"
      - "static/community-builder.*"
      - "tests/test_community_builder.py"
      - "theme_boards.py"
      - "static/theme-board.*"
      - "static/theme-portal.css"
      - "tests/test_theme_boards.py"
      - "tests/test_api.py"
      - ".github/workflows/community-builder-qa.yml"
  workflow_dispatch:

jobs:
  test:
    name: Smoke / API auth / Blogger ownership
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENVIRONMENT: development
      RELAND_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py db_engine.py community_builder.py theme_boards.py
      - run: node --check static/app.js
      - run: node --check static/community-builder.js
      - run: node --check static/theme-board.js
      - run: python -m pytest -q tests/test_community_builder.py tests/test_theme_boards.py tests/test_api.py
