name: RE:LAND Visual QA (one-off)
on:
  push:
    branches: [feat/community-blogger-builder-20261112]
    paths:
      - .github/workflows/reland-visual-qa-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa_theme_board_live.cjs
        env:
          QA_URL: https://reland.lexid.site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reland-theme-board-desktop-mobile-qa
          path: qa-screens
          retention-days: 7
