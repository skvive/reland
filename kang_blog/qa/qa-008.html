<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 8</title><body><article><h2>공개자료가 오래된 것 같을 때는요?</h2><p>먼저 새 문서가 실제 작성 또는 변경되었는지 확인해야 합니다. 공식 요청 시 문서명·작성시기·문의 취지를 구체화하면 좋습니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1032611667" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제124조(관련 자료의 공개 등)</a> — 정비사업 자료 공개 의무의 핵심 조항입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
