<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 5</title><body><article><h2>서면결의서만으로 총회가 유효하나요?</h2><p>서면 의결권의 인정과 출석·의결정족수·직접출석 요건은 별개입니다. 해당 안건에 적용되는 현행법과 정관을 확인해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029442429" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제45조(총회의 의결)</a> — 주요 총회의결사항과 정족수를 확인하는 기준입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
