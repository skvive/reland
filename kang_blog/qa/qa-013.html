<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 13</title><body><article><h2>행정소송 90일은 언제부터 계산하나요?</h2><p>취소소송은 일반적으로 처분을 안 날부터 90일의 기준이 있으며, 다른 한계·예외도 존재합니다. 처분서와 송달일·재결서 정본 등을 확보하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1033135725" target="_blank" rel="noopener noreferrer">행정소송법 제20조(제소기간)</a> — 취소소송 제소기간 및 예외를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
