<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 2</title><body><article><h2>이웃집과 종전자산평가액이 왜 다른가요?</h2><p>면적·권리관계·건물현황·평가 기준일 등 다양한 요소가 관여합니다. 감정평가서와 대상 명세를 확인하고 단일 시세 사례와 구분해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
