<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 10</title><body><article><h2>행정심판은 며칠 안에 청구하나요?</h2><p>일반적으로 처분을 알게 된 날부터 90일, 처분일부터 180일 기준이 있습니다. 예외와 개별 특별법, 처분 날짜·인지 날짜가 매우 중요합니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1018377597" target="_blank" rel="noopener noreferrer">행정심판법 제27조(심판청구의 기간)</a> — 통상 안 날부터 90일·처분일부터 180일의 기간과 예외를 정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
