<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 30</title><body><article><h2>갈등 해결을 위해 무엇부터 준비해야 하나요?</h2><p>사실확인표와 양측 주장표, 공식 공고·회의록·계약서의 출처를 먼저 정리하세요. 교육자료는 해결 가능성을 보장하지 않습니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1032611667" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제124조(관련 자료의 공개 등)</a> — 정비사업 자료 공개 의무의 핵심 조항입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
