<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 19</title><body><article><h2>조합 공사비가 증가하면 배임죄인가요?</h2><p>공사비 증가만으로 특정 범죄가 성립한다고 단정할 수 없습니다. 계약·권한·의사결정·재산상 손해 등 개별 구성요건에 관한 확인이 필요합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029127057" target="_blank" rel="noopener noreferrer">형사소송법 제237조(고소, 고발의 방식)</a> — 서면 또는 구술로 고소·고발하는 방식을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
