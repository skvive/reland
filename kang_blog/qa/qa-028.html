<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 28</title><body><article><h2>재개발 세입자도 보상받을 수 있나요?</h2><p>조건에 따라 관련 제도가 문제 될 수 있으나 모든 세입자에게 동일한 항목·금액이 보장되는 것은 아닙니다. 거주·영업 지위·공고·입증자료를 확인하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
