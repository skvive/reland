<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 16</title><body><article><h2>민사소장에는 반드시 무엇이 들어가나요?</h2><p>민사소송법 제249조는 당사자, 청구취지와 원인 등을 규정합니다. 개별 사건에 대한 실제 소장 작성은 적법한 전문가에게 의뢰해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1028533355" target="_blank" rel="noopener noreferrer">민사소송법 제249조(소장의 기재사항)</a> — 소장에 적어야 할 당사자·청구취지·청구원인을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
