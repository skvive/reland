<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 27</title><body><article><h2>조합원 분양 자격은 매수하면 자동 승계되나요?</h2><p>그렇지 않을 수 있습니다. 규제지역·사업유형·취득시기·예외에 따라 제한이 있으니 도시정비법 제39조와 실제 사업의 고시를 확인해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032614491" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제39조(조합원의 자격 등)</a> — 조합원 자격과 특정 지역·단계의 양도 제한을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
