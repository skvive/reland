<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 7</title><body><article><h2>조합 계약서를 공개해 달라고 할 수 있나요?</h2><p>도시정비법 제124조는 관련 자료 공개의무를 규정합니다. 문서가 공개 대상인지, 개인정보 제한은 있는지, 작성·변경일은 언제인지 확인하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1032611667" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제124조(관련 자료의 공개 등)</a> — 정비사업 자료 공개 의무의 핵심 조항입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
