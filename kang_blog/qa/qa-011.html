<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 11</title><body><article><h2>이의신청을 하면 행정심판 기한이 멈추나요?</h2><p>자동으로 중단된다고 가정하면 위험합니다. 이의신청·행정심판은 별개 제도일 수 있으니 해당 법률과 처분서 안내를 먼저 확인하세요.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1018377597" target="_blank" rel="noopener noreferrer">행정심판법 제27조(심판청구의 기간)</a> — 통상 안 날부터 90일·처분일부터 180일의 기간과 예외를 정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
