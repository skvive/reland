<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 15</title><body><article><h2>소송을 내면 사업이 정지되나요?</h2><p>소송 제기만으로 사업이 당연히 정지되는 것은 아닙니다. 집행정지 여부는 별도 문제이므로 해당 처분과 집행 상황을 구분하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1033135725" target="_blank" rel="noopener noreferrer">행정소송법 제20조(제소기간)</a> — 취소소송 제소기간 및 예외를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
