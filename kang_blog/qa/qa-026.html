<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 26</title><body><article><h2>관리처분계획에 분담금이 포함되나요?</h2><p>관리처분계획은 종전자산·분양예정·분양대상 등의 중요한 항목을 담습니다. 실제 항목과 산정 근거는 계획서 원문을 확인해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
