<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 25</title><body><article><h2>분양신청 기간이 끝나면 어떻게 되나요?</h2><p>일반적인 후속 절차는 법령과 실제 사업 진행에 따라 달라집니다. 분양신청 관련 통지·접수증·분양계획을 우선 보관하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1020045547" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제72조(분양공고 및 분양신청)</a> — 분양신청 통지·기간 및 추산분담금 공고 관련 규정입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
