<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 17</title><body><article><h2>내용증명만 보내면 소송이 되나요?</h2><p>내용증명 발송과 법원 소 제기는 별개의 행위입니다. 통지의 증빙과 실제 소송 절차를 혼동하지 않아야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1028533355" target="_blank" rel="noopener noreferrer">민사소송법 제249조(소장의 기재사항)</a> — 소장에 적어야 할 당사자·청구취지·청구원인을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
