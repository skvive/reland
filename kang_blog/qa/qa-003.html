<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 3</title><body><article><h2>공사비 증액 안건은 총회가 필요한가요?</h2><p>도시정비법 제45조의 총회 의결사항과 정족수, 구체적 안건 규모 및 적용 예외를 함께 확인해야 합니다. 원계약·변경계약·총회 자료를 대조하세요.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029442429" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제45조(총회의 의결)</a> — 주요 총회의결사항과 정족수를 확인하는 기준입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
