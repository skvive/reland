<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 20</title><body><article><h2>형사고소장을 대신 써줄 수 있나요?</h2><p>이 사이트는 고소 절차를 설명하는 일반 교육자료만 제공합니다. 사건별 고소장 작성·대리·유상 법률상담은 취급하지 않습니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1008648919" target="_blank" rel="noopener noreferrer">변호사법 제109조(벌칙)</a> — 비변호사의 유상 법률사무 취급에 관한 형사책임을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
