<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 21</title><body><article><h2>허위 수익 전망은 전부 사기인가요?</h2><p>전망의 부정확성과 형법상 기망의 성립은 구별해야 합니다. 당시 어떤 설명이 있었고 어떤 재산상 처분이 있었는지 자료를 정리하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1022927943" target="_blank" rel="noopener noreferrer">형법 제347조(사기)</a> — 기망에 의한 재물 교부·재산상 이익 취득의 구성요건을 확인합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
