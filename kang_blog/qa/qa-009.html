<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 9</title><body><article><h2>구청 민원 회신은 행정처분인가요?</h2><p>명칭이 아니라 구체적 권리의무에 미치는 법적 효과를 살펴야 합니다. 회신과 처분서를 분리하고 근거 조문 및 처분 이유를 확인하세요.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1016111783" target="_blank" rel="noopener noreferrer">행정절차법 제23조(처분의 이유 제시)</a> — 처분의 근거와 이유를 제시해야 하는 원칙을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
