<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 24</title><body><article><h2>사업시행인가와 관리처분인가는 같은가요?</h2><p>다릅니다. 사업시행 단계의 인허가와 조합원별 분양·권리 배분 내용을 담는 관리처분계획은 구분해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
