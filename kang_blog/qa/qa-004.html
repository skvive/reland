<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 4</title><body><article><h2>조합장이 마음대로 예산을 쓸 수 있나요?</h2><p>법령·정관·승인된 예산 범위에 따라 권한이 정해집니다. 지출액만으로 결론내리지 말고 예산·계약·의결·결산을 연결해서 살펴야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029442429" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제45조(총회의 의결)</a> — 주요 총회의결사항과 정족수를 확인하는 기준입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
