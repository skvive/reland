<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 6</title><body><article><h2>총회 결의를 무효라고 생각하면 어디에 확인하나요?</h2><p>결의가 연결된 인가·고시가 있었는지부터 확인하세요. 인가 전후 소송유형이 달라질 수 있다는 대법원 판례가 있어 사건별 전문가 검토가 필요합니다.</p><h3>법률 출처</h3><ul><li><a href="https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1029442429" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제45조(총회의 의결)</a> — 주요 총회의결사항과 정족수를 확인하는 기준입니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
