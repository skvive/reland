<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 22</title><body><article><h2>재개발 조합설립은 언제 가능한가요?</h2><p>사업유형에 따라 법정 동의 요건과 인가 절차가 다릅니다. 도시정비법 제35조의 현재 시행 내용과 정비구역 고시를 확인하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1028008393" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제35조(조합설립인가 등)</a> — 조합설립의 기본 요건과 동의의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
