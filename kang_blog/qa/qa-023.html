<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 23</title><body><article><h2>3D 조감도가 확정된 건축계획인가요?</h2><p>반드시 그렇지 않습니다. 홍보용 조감도와 인허가된 도면은 다를 수 있으니 고시문·사업시행계획서·도면 작성일을 확인해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1028008393" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제35조(조합설립인가 등)</a> — 조합설립의 기본 요건과 동의의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
