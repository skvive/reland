<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 1</title><body><article><h2>추정분담금이 두 배가 되면 바로 위법인가요?</h2><p>증액 자체가 자동으로 위법을 뜻하지는 않습니다. 기준시점·사업비·일반분양 수입·종전자산 평가액·의결 및 인가 자료를 비교해야 판단의 출발점이 됩니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
