<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 14</title><body><article><h2>총회가 잘못되면 인가도 당연히 무효인가요?</h2><p>자동으로 그렇게 되는 것은 아닙니다. 총회결의의 하자와 인가처분의 법적 효과를 구별해야 하며, 인가 전후 판례의 소송형태를 검토해야 합니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1033135725" target="_blank" rel="noopener noreferrer">행정소송법 제20조(제소기간)</a> — 취소소송 제소기간 및 예외를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
