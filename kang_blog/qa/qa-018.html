<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 18</title><body><article><h2>계약금 반환은 무조건 민사사건인가요?</h2><p>주된 권리 주장과 사실에 따라 민사적 문제가 중심이 될 수 있지만, 형사책임은 별도 구성요건이 있어야 합니다. 계약서·입금내역을 정리하세요.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1028533355" target="_blank" rel="noopener noreferrer">민사소송법 제249조(소장의 기재사항)</a> — 소장에 적어야 할 당사자·청구취지·청구원인을 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
