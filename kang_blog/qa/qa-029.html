<!doctype html><html lang="ko"><meta charset="utf-8"><title>재개발 Q&A 29</title><body><article><h2>이주비와 분담금은 같은 돈인가요?</h2><p>다릅니다. 금융약정 성격의 이주비와 조합원 분담금, 각종 보상금은 지급 주체와 법적 구조가 다를 수 있습니다.</p><h3>법률 출처</h3><ul><li><a href="https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&amp;lsJoLnkSeq=1032613459" target="_blank" rel="noopener noreferrer">도시 및 주거환경정비법 제74조(관리처분계획의 인가 등)</a> — 관리처분계획의 구성과 인가의 구조를 규정합니다.</li></ul><p><small>교육용 해설입니다. 개별 사건의 판단이나 자문이 아닙니다.</small></p></article></body></html>
